name: run-tests

on: [push, pull_request]

jobs:
  test:
    runs-on: ubuntu-22.04
    strategy:
      fail-fast: false
      matrix:
        php: [ "7.4" ]
        laravel: [ 7.* ]

    name: PHP ${{ matrix.php }} - Laravel ${{ matrix.laravel }}

    steps:
      -   name: Checkout code
          uses: actions/checkout@v4

      -   name: Cache dependencies
          uses: actions/cache@v4
          with:
            path: ~/.composer/cache/files
            key: dependencies-laravel-${{ matrix.laravel }}-php-${{ matrix.php }}-composer-${{ hashFiles('composer.json') }}

      -   name: Setup PHP
          uses: shivammathur/setup-php@v2
          with:
            php-version: ${{ matrix.php }}
            extensions: dom, curl, libxml, mbstring, zip, intl, soap
            coverage: none

      -   name: Install dependencies
          run: |
            composer require "laravel/framework:${{ matrix.laravel }}" --no-interaction --no-update
            # Composer 2.9+ refuses Laravel 7 releases with security advisories; older Composer lacks the flag
            FLAGS=""
            if composer update --help | grep -q -- "--no-security-blocking"; then FLAGS="--no-security-blocking"; fi
            composer update --prefer-dist --no-interaction --no-progress $FLAGS

      -   name: Execute tests
          run: vendor/bin/phpunit
